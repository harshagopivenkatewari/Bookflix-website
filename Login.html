<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlix Login</title>

    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-image: url('books2.webp'); 
            background-size: cover;
        }

        .login-page {
            text-align: center;
        }

        h1 {
            font-size: 48px;
            color:whitesmoke;
            margin-bottom: 20px;
            text-shadow: 2px 2px 5px rgba(0,0,0,0.2);
        }

        .login-box {
            background: white;
            padding: 30px;
            width: 330px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0,0,0,0.2);
            transition: 0.3s;
        }

        .login-box:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(0,0,0,0.3);
        }

        .login-box h2 {
            margin-bottom: 20px;
            color: #6a0dad;
        }

        label {
            float: left;
            font-weight: bold;
            margin-top: 10px;
            color: #444;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 5px;
            margin-bottom: 12px;
            border: 2px solid #ccc;
            border-radius: 8px;
            transition: 0.3s;
            font-size: 15px;
        }

        input:focus {
            border-color: #6a0dad;
            outline: none;
            box-shadow: 0 0 5px rgba(106, 13, 173, 0.5);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            background: #6a0dad;
            color: white;
            font-size: 17px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 12px;
            transition: 0.3s;
        }

        button:hover {
            background: #ff9a9e;
            color: #000;
        }

        .otp-btn {
            background: #ff69b4;
        }

        .otp-btn:hover {
            background: #ffb6c1;
        }

    </style>
</head>

<body>

    <form action="home.html" class="login-page">
        <h1>BookFlix</h1>

        <div class="login-box">
            <h2>Login</h2>

            <label>Mobile OR Username</label>
            <input type="text" placeholder="Enter username or mobile" required>

            <label>OTP</label>
            <input type="number" placeholder="Enter OTP" required>

            <button type="button" class="otp-btn">Resend OTP</button>
            <button type="submit">Login</button>
        </div>

    </form>

</body>
</html>
