<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login</title>

  <!-- Animation + UI styles -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/animation.css') }}">
</head>

<body>

<div class="wrap">

  <!-- ================= CHARACTERS ================= -->
  <div class="characters">

    <div class="char purple">
      <div class="eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="char black">
      <div class="eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="char orange">
      <div class="eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <div class="mouth"></div>
    </div>

    <div class="char yellow">
      <div class="eyes">
        <div class="eye"><div class="pupil"></div></div>
        <div class="eye"><div class="pupil"></div></div>
      </div>
      <div class="mouth"></div>
    </div>

  </div>

  <!-- ================= LOGIN CARD ================= -->
  <div class="card">

    <h2 style="margin-bottom:16px">Login</h2>

    <!-- MESSAGE AREA (NO POPUPS) -->
    <div id="formMessage" class="muted" style="margin-bottom:12px;"></div>

    <div class="field">
      <input id="email" type="email" placeholder="Email">
    </div>

    <div class="field">
      <input id="password" type="password" placeholder="Password">
    </div>

    <!-- SHOW PASSWORD -->
    <div style="margin:8px 0; font-size:14px;">
      <input type="checkbox" id="togglePassword">
      <label for="togglePassword">Show Password</label>
    </div>

    <div class="field">
      <button id="loginBtn">Login</button>
    </div>

    <!-- ================= FORGOT PASSWORD LINK ================= -->
    <div class="muted" style="margin-top:10px;">
      <a href="#" id="forgotLink" style="color:#2563eb;font-weight:600">
        Forgot password?
      </a>
    </div>

    <!-- ================= FORGOT PASSWORD SECTION ================= -->
    <div id="forgotSection" style="display:none; margin-top:16px;">

      <div class="field">
        <input id="forgotEmail" type="email" placeholder="Enter registered email">
      </div>

      <div class="field">
        <button id="sendForgotOtp">Send OTP</button>
      </div>

      <div id="forgotOtpSection" style="display:none;">

        <div class="field">
          <input id="forgotOtp" placeholder="Enter OTP">
        </div>

        <div class="field">
          <input id="newPassword" type="password" placeholder="New password">
        </div>

        <div class="field">
          <button id="resetPasswordBtn">Reset Password</button>
        </div>

      </div>

      <div class="muted" id="forgotMsg" style="margin-top:8px;"></div>

    </div>

    <!-- ================= REGISTER LINK ================= -->
    <div class="muted" style="margin-top:14px;">
      Don’t have an account?
      <a href="/register" style="color:#2563eb;font-weight:600">
        Create account
      </a>
    </div>

  </div>

</div>

<!-- ================= SCRIPTS ================= -->
<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="{{ url_for('static', filename='js/animation.js') }}"></script>
<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
